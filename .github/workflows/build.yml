name: build

on:
  push:
    branches:
      - develop
      - 'perf/**'
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
      - name: Verify legal files in distribution
        run: |
          test -s dist/LICENSE
          test -s dist/NOTICE
          test -s dist/THIRD_PARTY_NOTICES.txt
          grep -Fq "three.js authors" dist/THIRD_PARTY_NOTICES.txt
