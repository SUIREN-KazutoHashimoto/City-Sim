name: Bug report
description: 不具合や想定外の挙動を報告します
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。再現に必要な情報を可能な範囲で記載してください。

  - type: input
    id: version
    attributes:
      label: Version
      description: 画面に表示されるMachi-Simのバージョン、または確認したコミットを記載してください。
      placeholder: "例: 1.0.12"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: ブラウザ名とバージョンを記載してください。
      placeholder: "例: Chrome 140"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 症状
      description: 何が起きているかを簡潔に記載してください。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: seed、設定値、操作手順、発生時刻など、再現に必要な情報を記載してください。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の挙動
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: スクリーンショット・動画・ログ
      description: 必要に応じて添付してください。機密情報は含めないでください。

  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 発生頻度、影響範囲、回避策などがあれば記載してください。

  - type: checkboxes
    id: checklist
    attributes:
      label: 確認
      options:
        - label: 同じ内容のIssueがないか確認しました
          required: true
        - label: セキュリティ脆弱性の詳細を公開Issueへ記載していません
          required: true
