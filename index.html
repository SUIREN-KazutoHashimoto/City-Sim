<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machi-Sim — Realistic City Simulation</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; }
      #app { position: fixed; inset: 0; }
      #hud { position: fixed; top: 8px; left: 8px; z-index: 10; font: 12px/1.4 ui-monospace, monospace; color: #b7c7dd; background: rgba(10,14,20,.6); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; }
      #clock { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 12; font: 600 20px/1.1 ui-monospace, monospace; color: #eaf1fb; background: rgba(10,14,20,.7); padding: 6px 14px; border-radius: 8px; border: 1px solid #2c3a4f; letter-spacing: 1px; pointer-events: none; display: flex; gap: 12px; align-items: baseline; }
      #clock .day { font-size: 12px; opacity: .7; font-weight: 400; }
      #clock .icon { font-size: 16px; }
      #app-version { position: fixed; right: 8px; bottom: 8px; z-index: 20; font: 11px/1.2 ui-monospace, monospace; color: rgba(215,224,236,.72); background: rgba(8,12,18,.72); border: 1px solid rgba(52,68,91,.65); border-radius: 5px; padding: 4px 7px; letter-spacing: .3px; white-space: nowrap; text-align: right; pointer-events: none; user-select: none; }
      #boot-screen { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0b0e13; color: #e7eef8; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; opacity: 1; transition: opacity .25s ease; }
      #boot-screen.boot-screen--done { opacity: 0; pointer-events: none; }
      #boot-screen.boot-screen--error { background: #160f12; }
      .boot-card { width: min(560px, calc(100vw - 48px)); padding: 28px 30px 26px; border: 1px solid #2c3a4f; border-radius: 12px; background: rgba(12,18,27,.92); box-shadow: 0 18px 80px rgba(0,0,0,.38); }
      .boot-title { font-size: 18px; font-weight: 700; letter-spacing: .08em; margin-bottom: 22px; }
      #boot-stage { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
      #boot-detail { min-height: 34px; color: #9fb0c7; font-size: 12px; line-height: 1.45; }
      .boot-progress-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
      .boot-progress-track { position: relative; flex: 1; height: 7px; overflow: hidden; border-radius: 999px; background: #182332; border: 1px solid #2a3a50; }
      #boot-progress-fill { position: absolute; inset: 0; transform: scaleX(0); transform-origin: left center; background: #7396c8; transition: transform .12s linear; }
      #boot-progress-percent { width: 42px; text-align: right; color: #c8d5e7; font-size: 11px; }
      .boot-note { margin-top: 14px; color: #6f8199; font-size: 10px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="clock">booting…</div>
    <div id="hud">booting…</div>
    <div id="app-version">Machi-Sim</div>
    <div id="boot-screen" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-title">MACHI-SIM</div>
        <div id="boot-stage">起動しています</div>
        <div id="boot-detail">都市設定を読み込んでいます</div>
        <div class="boot-progress-row">
          <div class="boot-progress-track"><div id="boot-progress-fill"></div></div>
          <div id="boot-progress-percent">0%</div>
        </div>
        <div class="boot-note">都市生成後、05:00 から 08:00 まで内部シミュレーションを行い、朝の活動が落ち着いた状態から開始します。</div>
      </div>
    </div>
    <script type="module" src="/src/rendering/UiLayoutTuning.ts"></script>
    <script type="module" src="/src/benchmark/BenchmarkBootstrap.ts"></script>
    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      import { APP_VERSION } from '/src/version.ts';

      const updateAppIdentity = () => {
        const appVersion = document.getElementById('app-version');
        if (appVersion) appVersion.textContent = `Machi-Sim v${APP_VERSION} · © 2026 Machi-Sim contributors`;
      };

      updateAppIdentity();
      window.addEventListener('citysim-ready', updateAppIdentity, { once: true });
    </script>
  </body>
</html>
